name: Monday — citations, listening, report

on:
  schedule:
    - cron: "15 3 * * 1"   # Mondays 06:15 Nairobi time (03:15 UTC)
  workflow_dispatch: {}     # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  monday:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      REPORT_TO: info@storieswetell.xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code

      - name: AI citation run
        run: python scripts/citation_check.py
        continue-on-error: true

      - name: Listening pull
        run: python scripts/listening_pull.py
        continue-on-error: true

      - name: CMO agent — analyse and report
        run: |
          claude -p "You are running unattended. Read CLAUDE.md. Then, in order:
          1. Follow .claude/skills/citation-check/SKILL.md steps 2 and 3 on today's run (skip step 1, it already ran).
          2. Follow .claude/skills/market-listening/SKILL.md steps 2 and 3 on today's pull (skip step 1).
          3. Follow .claude/skills/monday-report/SKILL.md, including sending the email.
          Log every action with scripts/log_action.py. Do not publish anything anywhere." \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(python scripts/*),Bash(python3 scripts/*),Bash(python -c *)"

      - name: Save outputs to the repo
        if: always()
        run: |
          git config user.name "swt-cmo-agent"
          git config user.email "info@storieswetell.xyz"
          git add outputs logs drafts || true
          git diff --cached --quiet || git commit -m "CMO agent: Monday run $(date -u +%F)"
          git push
